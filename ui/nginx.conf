server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # Pipeline runs are slow; don't let the proxy give up before the API does.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
