<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>CDR pipeline: 13 nodes in four phases</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="960" height="560" rx="14" fill="#0f172a"/>
<text x="30" y="40" fill="#f1f5f9" font-size="19" font-weight="700">The CDR pipeline</text>
<text x="30" y="62" fill="#94a3b8" font-size="12.5">13 LangGraph nodes sharing one typed state. Every arrow is a Pydantic contract: bad data fails loudly instead of flowing downstream.</text>
<rect x="170" y="78" width="170" height="22" rx="11" fill="none" stroke="#60a5fa" stroke-dasharray="4 3"/>
<text x="255.0" y="93" fill="#93c5fd" font-size="11.5" text-anchor="middle">clinical question (free text)</text>
<line x1="255.0" y1="100" x2="255.0" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="151.0" fill="#3b82f6" font-size="11" font-weight="700" letter-spacing="1.5">RETRIEVE</text>
<rect x="170" y="120" width="170" height="54" rx="9" fill="#111827" stroke="#3b82f6" stroke-width="1.6"/>
<text x="255.0" y="142" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">parse_question</text>
<text x="255.0" y="161" fill="#94a3b8" font-size="11" text-anchor="middle">question → PICO</text>
<line x1="342" y1="147.0" x2="367" y2="147.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="370" y="120" width="170" height="54" rx="9" fill="#111827" stroke="#3b82f6" stroke-width="1.6"/>
<text x="455.0" y="142" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">plan_search</text>
<text x="455.0" y="161" fill="#94a3b8" font-size="11" text-anchor="middle">PICO → queries</text>
<line x1="542" y1="147.0" x2="567" y2="147.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="120" width="170" height="54" rx="9" fill="#111827" stroke="#3b82f6" stroke-width="1.6"/>
<text x="655.0" y="142" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">retrieve</text>
<text x="655.0" y="161" fill="#94a3b8" font-size="11" text-anchor="middle">PubMed · CT.gov</text>
<line x1="742" y1="147.0" x2="767" y2="147.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="770" y="120" width="170" height="54" rx="9" fill="#111827" stroke="#3b82f6" stroke-width="1.6"/>
<text x="855.0" y="142" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">deduplicate</text>
<text x="855.0" y="161" fill="#94a3b8" font-size="11" text-anchor="middle">PMID + title match</text>
<path d="M855.0,176 V202.0 H255.0 V227" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="261.0" fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="1.5">SCREEN</text>
<rect x="170" y="230" width="170" height="54" rx="9" fill="#111827" stroke="#f59e0b" stroke-width="1.6"/>
<text x="255.0" y="252" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">screen</text>
<text x="255.0" y="271" fill="#94a3b8" font-size="11" text-anchor="middle">include / exclude + reason</text>
<line x1="342" y1="257.0" x2="367" y2="257.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="370" y="230" width="170" height="54" rx="9" fill="#111827" stroke="#f59e0b" stroke-width="1.6"/>
<text x="455.0" y="252" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">parse_docs</text>
<text x="455.0" y="271" fill="#94a3b8" font-size="11" text-anchor="middle">PMC full text → snippets</text>
<line x1="542" y1="257.0" x2="567" y2="257.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="230" width="170" height="54" rx="9" fill="#111827" stroke="#f59e0b" stroke-width="1.6"/>
<text x="655.0" y="252" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">extract_data</text>
<text x="655.0" y="271" fill="#94a3b8" font-size="11" text-anchor="middle">→ study cards</text>
<path d="M655.0,286 V312.0 H255.0 V337" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="371.0" fill="#8b5cf6" font-size="11" font-weight="700" letter-spacing="1.5">ANALYZE</text>
<rect x="170" y="340" width="170" height="54" rx="9" fill="#111827" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="255.0" y="362" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">assess_rob2</text>
<text x="255.0" y="381" fill="#94a3b8" font-size="11" text-anchor="middle">RoB 2 · ROBINS-I</text>
<line x1="342" y1="367.0" x2="367" y2="367.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="370" y="340" width="170" height="54" rx="9" fill="#111827" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="455.0" y="362" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">synthesize</text>
<text x="455.0" y="381" fill="#94a3b8" font-size="11" text-anchor="middle">→ claims + GRADE</text>
<line x1="542" y1="367.0" x2="567" y2="367.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="340" width="170" height="54" rx="9" fill="#111827" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="655.0" y="362" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">critique</text>
<text x="655.0" y="381" fill="#94a3b8" font-size="11" text-anchor="middle">skeptic attacks claims</text>
<path d="M655.0,396 V422.0 H255.0 V447" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="481.0" fill="#22c55e" font-size="11" font-weight="700" letter-spacing="1.5">PUBLISH</text>
<rect x="170" y="450" width="170" height="54" rx="9" fill="#111827" stroke="#22c55e" stroke-width="1.6"/>
<text x="255.0" y="472" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify</text>
<text x="255.0" y="491" fill="#94a3b8" font-size="11" text-anchor="middle">claim vs. its snippets</text>
<line x1="342" y1="477.0" x2="367" y2="477.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="370" y="450" width="170" height="54" rx="9" fill="#111827" stroke="#22c55e" stroke-width="1.6"/>
<text x="455.0" y="472" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">compose</text>
<text x="455.0" y="491" fill="#94a3b8" font-size="11" text-anchor="middle">A + B ⇒ C  (DoD 3)</text>
<line x1="542" y1="477.0" x2="567" y2="477.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="450" width="170" height="54" rx="9" fill="#111827" stroke="#22c55e" stroke-width="1.6"/>
<text x="655.0" y="472" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">publish</text>
<text x="655.0" y="491" fill="#94a3b8" font-size="11" text-anchor="middle">gates → report</text>
<line x1="742" y1="477.0" x2="767" y2="477.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="770" y="450" width="170" height="54" rx="27" fill="none" stroke="#4ade80" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="855.0" y="472" fill="#bbf7d0" font-size="13" font-weight="700" text-anchor="middle">Report</text>
<text x="855.0" y="491" fill="#94a3b8" font-size="11" text-anchor="middle">JSON · Markdown · HTML</text>
<line x1="30" y1="524" x2="930" y2="524" stroke="#1e293b"/>
<text x="30" y="546" fill="#94a3b8" font-size="11.5">Nothing retrieved, or nothing passes screening? The graph jumps straight to publish and reports insufficient evidence instead of guessing.</text>
</svg>
