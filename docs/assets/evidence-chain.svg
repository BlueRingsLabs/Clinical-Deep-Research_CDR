<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One real CDR claim traced from question to source</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="330" rx="14" fill="#0f172a"/>

  <!-- Question -->
  <rect x="24" y="44" width="250" height="176" rx="10" fill="#111c33" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="42" y="72" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1.2">QUESTION</text>
  <text fill="#e2e8f0" font-size="13.5">
    <tspan x="42" y="100">What is the comparative</tspan>
    <tspan x="42" y="121">effectiveness of SGLT2</tspan>
    <tspan x="42" y="142">inhibitors versus GLP-1 receptor</tspan>
    <tspan x="42" y="163">agonists for cardiovascular</tspan>
    <tspan x="42" y="184">outcomes in type 2 diabetes?</tspan>
  </text>

  <line x1="276" y1="132" x2="316" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296" y="118" fill="#64748b" font-size="10" text-anchor="middle">CDR</text>

  <!-- Claim -->
  <rect x="320" y="30" width="330" height="204" rx="10" fill="#1a1530" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="338" y="58" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1.2">CLAIM</text>
  <text fill="#f1f5f9" font-size="13.5">
    <tspan x="338" y="86">SGLT2 inhibitors may reduce the risk of</tspan>
    <tspan x="338" y="107">major adverse cardiovascular events</tspan>
    <tspan x="338" y="128">(MACEs) compared to GLP-1 receptor</tspan>
    <tspan x="338" y="149">agonists in patients with type 2 diabetes.</tspan>
  </text>
  <rect x="338" y="170" width="124" height="24" rx="12" fill="#3b2a0a" stroke="#f59e0b"/>
  <text x="400" y="186" fill="#fbbf24" font-size="11.5" font-weight="600" text-anchor="middle">GRADE: low</text>
  <rect x="470" y="170" width="162" height="24" rx="12" fill="#3a1414" stroke="#ef4444"/>
  <text x="551" y="186" fill="#fca5a5" font-size="11.5" font-weight="600" text-anchor="middle">verifier: unverifiable</text>
  <text x="338" y="219" fill="#94a3b8" font-size="11">The verifier couldn't confirm it, so the report says so.</text>

  <!-- Snippets -->
  <line x1="652" y1="104" x2="692" y2="74" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="652" y1="150" x2="692" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="696" y="44" width="240" height="58" rx="10" fill="#0f2419" stroke="#22c55e" stroke-width="1.5"/>
  <text x="712" y="66" fill="#4ade80" font-size="11" font-weight="700" letter-spacing="1.2">SNIPPET</text>
  <text x="712" y="88" fill="#e2e8f0" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pubmed_41678006_snip_0</text>
  <rect x="696" y="118" width="240" height="58" rx="10" fill="#0f2419" stroke="#22c55e" stroke-width="1.5"/>
  <text x="712" y="140" fill="#4ade80" font-size="11" font-weight="700" letter-spacing="1.2">SNIPPET</text>
  <text x="712" y="162" fill="#e2e8f0" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pubmed_41678006_snip_1</text>

  <!-- Source -->
  <line x1="816" y1="178" x2="816" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="696" y="200" width="240" height="44" rx="10" fill="#111827" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="712" y="227" fill="#cbd5e1" font-size="13" font-weight="600">Source: PubMed 41678006</text>

  <!-- Caption -->
  <line x1="24" y1="272" x2="936" y2="272" stroke="#1e293b"/>
  <text x="24" y="298" fill="#e2e8f0" font-size="14" font-weight="600">Every claim points to the passages it rests on, and to the paper those passages came from.</text>
  <text x="24" y="318" fill="#94a3b8" font-size="12">Real, unedited output from examples/output/online/run_06. No snippet, no claim. Weak evidence gets labeled weak.</text>
</svg>
