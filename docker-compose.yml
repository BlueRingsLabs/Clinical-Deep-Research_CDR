# CDR — API + UI
#
#   cp .env.example .env    # add at least one LLM provider key
#   docker compose up --build
#
#   API docs: http://localhost:8000/docs
#   UI:       http://localhost:5173

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
