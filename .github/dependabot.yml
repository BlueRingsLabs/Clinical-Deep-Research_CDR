version: 2
updates:
  # Python — updates pyproject.toml and uv.lock together
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # openai 3: blocked by ragas -> instructor (eval extra), which caps openai below 3.19.
      # Revisit when instructor supports openai 3.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    # Majors that need a real migration (#97), not a bump PR that can't go green:
    # - ESLint 10: plugins still declare eslint <=9 as a peer
    # - Tailwind 4: new config format and engine
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, infrastructure]
