# CDR CI — runs on every push to main and every pull request.
#
#   lint      ruff (lint + format) — must pass
#   backend   pytest, fully offline, with coverage — must pass
#   types     mypy — advisory: reports the error count, never fails
#   openapi   spec export must match docs/openapi.json
#   eval      offline structural evaluation on the golden set
#   frontend  typecheck + eslint + vitest — must pass
#   e2e       Playwright against the production build

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests eval scripts examples
      - run: uv run ruff format --check src tests eval scripts examples

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest (no network — tests must be fully mocked)
        env:
          no_proxy: "*"
        run: |
          uv run pytest tests/ -q \
            --junitxml=test_reports/junit.xml \
            --cov=src/cdr --cov-branch \
            --cov-report=xml:test_reports/coverage.xml \
            --cov-report=term-missing:skip-covered
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: test_reports/

  types:
    name: Type check (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # Reports, never fails: the codebase isn't mypy-clean yet, and a permanently red
      # check on every PR would teach people to ignore red checks.
      - name: mypy (advisory)
        run: |
          if uv run mypy src/cdr > mypy.txt 2>&1; then
            echo "mypy: clean" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            summary=$(tail -n 1 mypy.txt)
            echo "::warning title=mypy (advisory)::$summary"
            echo "mypy (advisory): $summary" >> "$GITHUB_STEP_SUMMARY"
          fi

  openapi:
    name: OpenAPI spec is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/export_openapi.py --output docs/openapi.json
      - name: Fail if the committed spec is stale
        run: |
          git diff --exit-code docs/openapi.json || {
            echo "::error::docs/openapi.json is out of date. Run: uv run python scripts/export_openapi.py --output docs/openapi.json"
            exit 1
          }

  eval:
    name: Offline eval (golden set)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m eval.eval_runner --dataset eval/datasets/golden_set_toy.json --output eval/results/
      - run: uv run python -m eval.eval_runner --dataset eval/cases/ --output eval/results/cases/
      - name: Summarize
        run: |
          LATEST=$(ls -t eval/results/*_results.json 2>/dev/null | head -1)
          [ -n "$LATEST" ] || { echo "::error::No eval results generated"; exit 1; }
          uv run python - "$LATEST" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          agg = d.get("aggregate", d.get("summary", {}))
          total = agg.get("total_questions", d.get("total_questions", 0))
          passed = agg.get("passed", 0)
          print(f"Questions: {total}  Passed: {passed}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-offline-results
          path: eval/results/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.config.ts
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
